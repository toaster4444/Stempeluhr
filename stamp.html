<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>Stempeluhr – NFC Stempelung</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#1f2933" />
  <link rel="stylesheet" href="src/css/style.css" />
  <style>
    body { padding-top: 1.5rem; }
    .status-card { max-width: 560px; margin: 0 auto; text-align: center; }
    .status-card .value { font-size: 1.8rem; }
    .status-card .mono { font-size: 0.95rem; }
  </style>
</head>
<body>
  <main class="container">
    <section class="card status-card">
      <h1>NFC-Stempelung</h1>
      <p class="muted">Diese Seite löst eine Stempelung aus, wenn du mit dem NFC-Tag öffnest.</p>

      <div style="margin-top: 1.25rem;">
        <div class="label">Status</div>
        <div class="value" id="stampStatus">Bitte warten…</div>
        <div class="muted small mono" id="stampDetail">–</div>
      </div>

      <div style="margin-top: 1.5rem;">
        <a class="btn secondary" href="index.html">Zur Übersicht</a>
      </div>
    </section>
  </main>

  <script src="src/js/storage.js"></script>
  <script src="src/js/clock.js"></script>
  <script>
    (function () {
      const TIMEOUT_MS = 10000;

      function pad2(value) {
        return String(value).padStart(2, "0");
      }

      function setStatus(text, detail, isWarning) {
        const statusEl = document.getElementById("stampStatus");
        const detailEl = document.getElementById("stampDetail");
        if (statusEl) {
          statusEl.textContent = text;
          statusEl.classList.toggle("warn", Boolean(isWarning));
        }
        if (detailEl) detailEl.textContent = detail;
      }

      function attemptStamp() {
        const now = new Date();
        const last = StorageService.getLastStamp();

        if (last && typeof last.timestamp === "number") {
          const diff = now.getTime() - last.timestamp;
          if (diff >= 0 && diff < TIMEOUT_MS) {
            const remaining = Math.ceil((TIMEOUT_MS - diff) / 1000);
            setStatus("Stempelung blockiert", `Bitte noch ${remaining} Sek. warten.`, true);
            return;
          }
        }

        const result = Clock.toggleStamp();
        const action = result.type === "IN" ? "Eingestempelt" : "Ausgestempelt";
        const suffix = result.manualRequired ? " (manuelle Prüfung nötig)" : "";
        setStatus(`${action} um ${result.timeString}`, `Timeout: 10 Sek. aktiv${suffix}`, false);
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", attemptStamp);
      } else {
        attemptStamp();
      }
    })();
  </script>
</body>
</html>
