<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Stempeluhr</title>

  <link rel="manifest" href="public/manifest.webmanifest" />
  <meta name="theme-color" content="#1f2933" />
  <link rel="icon" href="public/icons/icon-192.png" />

  <link rel="stylesheet" href="public/style.css" />
</head>
<body>

  <header class="topbar">
    <div>
      <h1>Stempeluhr</h1>
      <p class="muted">Lokale Zeiterfassung</p>
    </div>

    <nav class="nav">
      <!-- WICHTIG: war vorher ein Link auf toggle.html, jetzt ist es ein Button -->
      <button class="btn" id="btnStampNow" type="button">Jetzt stempeln</button>
      <a class="btn secondary" href="settings.html">Einstellungen</a>
    </nav>
  </header>

  <main class="container">

    <section class="card">
      <div class="row">
        <h2>Heute</h2>
        <div class="muted small" id="todayDate">–</div>
      </div>

      <div class="grid2" style="margin-top:0.75rem;">
        <div class="stat">
          <div class="label">Soll</div>
          <div class="value" id="todayTarget">–</div>
        </div>
        <div class="stat">
          <div class="label">Ist</div>
          <div class="value" id="todayActual">–</div>
        </div>
        <div class="stat">
          <div class="label">Differenz</div>
          <div class="value" id="todayDiff">–</div>
        </div>
        <div class="stat">
          <div class="label">Status</div>
          <div class="value" id="todayStatus">–</div>
        </div>
      </div>

      <div class="muted small" style="margin-top:0.75rem;" id="todayFlags">–</div>

      <div class="actions" style="margin-top:1rem;">
        <button class="btn secondary" id="btnRefresh" type="button">Aktualisieren</button>
        <button class="btn secondary" id="btnRecalc" type="button">Neu berechnen</button>
      </div>
    </section>

    <section class="card">
      <div class="row">
        <h2>Monat</h2>
        <div class="muted small" id="monthRange">–</div>
      </div>

      <div class="grid2" style="margin-top:0.75rem;">
        <div class="stat">
          <div class="label">Soll</div>
          <div class="value" id="monthTarget">–</div>
        </div>
        <div class="stat">
          <div class="label">Ist</div>
          <div class="value" id="monthActual">–</div>
        </div>
        <div class="stat">
          <div class="label">Differenz</div>
          <div class="value" id="monthDiff">–</div>
        </div>
      </div>

      <div class="muted small" style="margin-top:0.5rem;" id="monthFlags">–</div>
    </section>

    <section class="card">
      <h2>Kalender (Feiertage & Abwesenheiten)</h2>
      <div id="calendarMount"></div>
    </section>

    <section class="card">
      <div class="row">
        <h2>Fehltage (Urlaub/Krankheit)</h2>
        <div class="actions">
          <button class="btn secondary" id="btnAbsRefresh" type="button">Aktualisieren</button>
        </div>
      </div>
      <div id="absencesMount"></div>
    </section>

    <section class="card">
      <div class="row">
        <h2>Manuelle Einträge</h2>
        <div class="actions">
          <button class="btn secondary" id="btnManualRefresh" type="button">Aktualisieren</button>
        </div>
      </div>
      <div id="manualMount"></div>
    </section>

    <section class="card">
      <div class="row">
        <h2>Export</h2>
        <div class="actions">
          <button class="btn secondary" id="btnExportCsv" type="button">CSV</button>
          <button class="btn secondary" id="btnExportJson" type="button">JSON</button>
        </div>
      </div>
      <div class="muted small" id="exportHint" style="margin-top:0.5rem;">–</div>
    </section>

  </main>

  <!-- Scripts (Reihenfolge wichtig: storage.js zuerst) -->
  <script src="src/js/storage.js"></script>
  <!-- NEU: clock.js lädt die Toggle-Stempel-Logik (window.Clock.toggleStamp) -->
  <script src="src/js/clock.js"></script>

  <script src="src/js/export.js"></script>
  <script src="src/js/holidays.js"></script>
  <script src="src/js/analytics.js"></script>

  <script src="src/js/absence.js"></script>
  <script src="src/js/manual_work.js"></script>
  <script src="src/js/calendar.js"></script>

  <script src="src/js/install.js"></script>

  <script>
    (function () {
      function pad2(n) { return String(n).padStart(2, "0"); }

      function fmtDate(d) {
        return `${pad2(d.getDate())}.${pad2(d.getMonth() + 1)}.${d.getFullYear()}`;
      }

      function msToHHMM(ms) {
        const sign = ms < 0 ? "-" : "";
        const a = Math.abs(ms);
        const totalMin = Math.round(a / 60000);
        const hh = Math.floor(totalMin / 60);
        const mm = totalMin % 60;
        return `${sign}${pad2(hh)}:${pad2(mm)}`;
      }

      function setText(id, value) {
        const el = document.getElementById(id);
        if (el) el.textContent = value;
      }

      function setHint(text) {
        const el = document.getElementById("exportHint");
        if (el) el.textContent = text;
      }

      // ---------- Problem-Helper ----------
      // Liefert { hasIssue:boolean, text:string } für ein Datum.
      function getIssueForDate(dateStr) {
        const d = StorageService.getDay(dateStr);
        const stamps = (d && d.stamps) ? d.stamps.slice() : [];
        stamps.sort((a, b) => a.timestamp - b.timestamp);

        if (!stamps.length) return { hasIssue: false, text: "" };

        // Problem: gleicher Typ zweimal hintereinander (z.B. IN, IN)
        for (let i = 1; i < stamps.length; i++) {
          if (stamps[i].type === stamps[i - 1].type) {
            return { hasIssue: true, text: "Doppelter Typ (z.B. IN/IN)" };
          }
        }

        // Problem: ungerade Anzahl (IN ohne OUT)
        const inCount = stamps.filter(s => s.type === "IN").length;
        const outCount = stamps.filter(s => s.type === "OUT").length;
        if (inCount !== outCount) {
          return { hasIssue: true, text: "IN/OUT nicht ausgeglichen" };
        }

        // Problem: manuelle Korrektur erforderlich markiert
        if (stamps.some(s => s.manualRequired)) {
          return { hasIssue: true, text: "Manuelle Prüfung nötig" };
        }

        return { hasIssue: false, text: "" };
      }

      // ---------- RENDER: Hauptübersicht ----------
      function renderMain() {
        const now = new Date();
        const todayStr = StorageService.dateToStr(now);
        setText("todayDate", fmtDate(now));

        const settings = StorageService.getSettings();
        const day = StorageService.getDay(todayStr);

        const isHoliday = HolidaysService.isHoliday(todayStr);
        const abs = AbsenceService.getAbsence(todayStr);

        const targetMs = AnalyticsService.getTargetForDate(todayStr, settings, isHoliday, abs);
        const actualMs = AnalyticsService.getActualForDate(todayStr, day);
        const diffMs = actualMs - targetMs;

        setText("todayTarget", msToHHMM(targetMs));
        setText("todayActual", msToHHMM(actualMs));
        setText("todayDiff", msToHHMM(diffMs));

        const issue = getIssueForDate(todayStr);
        const flags = [];
        if (isHoliday) flags.push("Feiertag");
        if (abs) flags.push(abs.type);
        if (issue.hasIssue) flags.push("⚠️ Problem: " + issue.text);

        setText("todayFlags", flags.length ? flags.join(" • ") : "–");
        setText("todayStatus", issue.hasIssue ? "⚠️ prüfen" : (diffMs >= 0 ? "OK" : "–"));
      }

      // ---------- RENDER: Monat ----------
      function renderAnalysis() {
        const settings = StorageService.getSettings();
        const now = new Date();
        const year = now.getFullYear();
        const month = now.getMonth(); // 0..11

        const first = new Date(year, month, 1);
        const last = new Date(year, month + 1, 0);

        setText("monthRange", `${fmtDate(first)} – ${fmtDate(last)}`);

        const result = AnalyticsService.getMonthSummary(year, month, settings, HolidaysService, AbsenceService);

        setText("monthTarget", msToHHMM(result.targetMs));
        setText("monthActual", msToHHMM(result.actualMs));
        setText("monthDiff", msToHHMM(result.actualMs - result.targetMs));

        const flags = [];
        if (result.problemDays && result.problemDays.length) {
          flags.push(`⚠️ Problem-Tage: ${result.problemDays.length}`);
        }
        setText("monthFlags", flags.length ? flags.join(" • ") : "–");
      }

      function renderCalendar() {
        const mount = document.getElementById("calendarMount");
        if (!mount) return;
        mount.innerHTML = "";
        CalendarService.render(mount);
      }

      function renderAbsences() {
        const mount = document.getElementById("absencesMount");
        if (!mount) return;
        mount.innerHTML = "";
        AbsenceService.render(mount);
      }

      function renderManualWork() {
        const mount = document.getElementById("manualMount");
        if (!mount) return;
        mount.innerHTML = "";
        ManualWorkService.render(mount);
      }

      function renderAll() {
        renderAnalysis();
        renderCalendar();
        renderAbsences();
        renderManualWork();
        renderMain();
      }

      // ---------- BUTTONS ----------
      // NEU: Jetzt stempeln direkt auf der Startseite
      const btnStampNow = document.getElementById("btnStampNow");
      if (btnStampNow) {
        btnStampNow.onclick = () => {
          try {
            const result = Clock.toggleStamp(); // IN oder OUT
            setHint(`Gestempelt: ${result.type} • ${result.timeString}`);
            renderAll();
          } catch (e) {
            console.error(e);
            setHint("Fehler beim Stempeln (siehe Konsole)");
          }
        };
      }

      document.getElementById("btnRefresh").onclick = () => { renderAll(); setHint("Aktualisiert"); };
      document.getElementById("btnRecalc").onclick = () => { renderAnalysis(); renderCalendar(); };

      document.getElementById("btnAbsRefresh").onclick = () => {
        AbsenceService.ensureAutoVacationUpToYesterday();
        renderAbsences();
        renderCalendar();
        renderAnalysis();
        setHint("Fehltage aktualisiert");
      };

      document.getElementById("btnManualRefresh").onclick = () => {
        renderManualWork();
        renderAnalysis();
        setHint("Manuelle Einträge aktualisiert");
      };

      document.getElementById("btnExportCsv").onclick = () => {
        ExportService.exportStampsCSV({ delimiter: ";" });
        setHint("CSV exportiert");
      };
      document.getElementById("btnExportJson").onclick = () => {
        ExportService.exportAllJSON();
        setHint("JSON exportiert");
      };

      renderAll();
    })();
  </script>

</body>
</html>
