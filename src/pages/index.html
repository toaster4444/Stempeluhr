<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>Stempeluhr – Übersicht</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- PWA / App-Icons -->
  <link rel="manifest" href="/public/manifest.json" />
  <meta name="theme-color" content="#1f2933" />

  <link rel="stylesheet" href="/src/css/style.css" />
</head>
<body>

  <header class="topbar">
    <div>
      <h1>Stempeluhr</h1>
      <p class="muted" id="subtitle">Lokale Zeiterfassung</p>
    </div>

    <nav class="nav">
      <a class="btn" href="/toggle">Jetzt stempeln</a>
      <a class="btn secondary" href="/settings">Einstellungen</a>
    </nav>
  </header>

  <main class="container">
    <section class="card">
      <h2>Status</h2>
      <div class="grid2">
        <div>
          <div class="label">Letzter Stempel</div>
          <div class="value" id="lastStampValue">–</div>
          <div class="muted" id="lastStampMeta">–</div>
        </div>
        <div>
          <div class="label">Hinweise</div>
          <div id="alerts" class="alerts">
            <div class="muted">Keine</div>
          </div>
        </div>
      </div>
    </section>

    <section class="card">
      <div class="row">
        <h2>Rohdaten (letzte 30)</h2>
        <div class="row-right">
          <button class="btn secondary" id="btnRefresh" type="button">Aktualisieren</button>
        </div>
      </div>

      <div class="actions" style="margin: 0.5rem 0 0.75rem;">
        <button class="btn" id="btnExportCsv" type="button">Export (Excel/CSV)</button>
        <button class="btn secondary" id="btnExportJson" type="button">Backup (JSON)</button>
        <span class="muted small" id="exportHint">–</span>
      </div>

      <div class="table-wrap">
        <table class="table">
          <thead>
            <tr>
              <th>Typ</th>
              <th>Datum</th>
              <th>Uhrzeit</th>
              <th>ISO</th>
              <th>Manuell nötig</th>
            </tr>
          </thead>
          <tbody id="stampsTbody">
            <tr><td colspan="5" class="muted">Noch keine Einträge</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <footer class="footer muted">
    <span>Alles lokal im Browser gespeichert.</span>
  </footer>

  <script src="/src/js/storage.js"></script>
  <script src="/src/js/ui.js"></script>
  <script src="/src/js/export.js"></script>

  <script>
    (function () {
      function pad2(n) { return String(n).padStart(2, "0"); }

      function formatDate(st) {
        return `${st.year}-${pad2(st.month)}-${pad2(st.day)}`;
      }

      function formatTime(st) {
        return `${pad2(st.hour)}:${pad2(st.minute)}:${pad2(st.second)}`;
      }

      function setHint(text) {
        const el = document.getElementById("exportHint");
        if (el) el.textContent = text;
      }

      function render() {
        const data = StorageService.getData();
        const stamps = data.stamps || [];
        const last = stamps[stamps.length - 1];

        document.getElementById("lastStampValue").textContent =
          last ? `${last.type} • ${formatDate(last)} ${formatTime(last)}` : "–";

        document.getElementById("lastStampMeta").textContent =
          last ? `timestamp: ${last.timestamp}` : "Noch keine Stempel vorhanden";

        const alerts = document.getElementById("alerts");
        alerts.innerHTML = "";

        const manual = stamps.filter(s => s.manualRequired);
        if (manual.length === 0) {
          alerts.innerHTML = `<div class="muted">Keine</div>`;
        } else {
          manual.slice(-5).reverse().forEach(s => {
            const div = document.createElement("div");
            div.className = "alert";
            div.textContent =
              `⚠️ Manuelle Prüfung: ${formatDate(s)} ${formatTime(s)}`;
            alerts.appendChild(div);
          });
        }

        const tbody = document.getElementById("stampsTbody");
        tbody.innerHTML = "";

        stamps.slice(-30).reverse().forEach(st => {
          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td class="${st.manualRequired ? "warn" : ""}">${st.type}</td>
            <td>${formatDate(st)}</td>
            <td>${formatTime(st)}</td>
            <td class="mono">${st.iso}</td>
            <td class="${st.manualRequired ? "warn" : "muted"}">
              ${st.manualRequired ? "JA" : "nein"}
            </td>
          `;
          tbody.appendChild(tr);
        });
      }

      document.getElementById("btnRefresh").onclick = () => {
        render();
        setHint("Aktualisiert");
      };

      document.getElementById("btnExportCsv").onclick = () => {
        ExportService.exportStampsCSV({ delimiter: ";" });
        setHint("CSV exportiert");
      };

      document.getElementById("btnExportJson").onclick = () => {
        ExportService.exportAllJSON();
        setHint("JSON exportiert");
      };

      render();
    })();
  </script>

  <script src="/src/js/install.js"></script>

</body>
</html>
